<!DOCTYPE html>

<html lang="en">

    <head>
        <meta charset="UTF-8"> 
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>user registration</title>
    </head>

    <body>
        <form action="" method="post">
            <fieldset>
                <legend>User Registration</legend>
                <br><br>

                <label for="fullname"> Full Name: </label>
                <input type="text" minlength="5" id="fullname" name="fullname" required/>

                <label for="email">Email: </label>
                <input type="email" id="email" name="email" required/>

                <label for="password">password </label>
                <input type="password" minlength="10" id="password" name="password" required/>
        
                <br><br>
                <fieldset>

                    <legend>Gender</legend>

                    <input type="radio" id="male" name="gender" value="male" required>
                    <label for="male">Male</label>

                    <input type="radio" id="female" name="gender" value="female">
                    <label for="female">Female</label>

                </fieldset>
     
                <br><br>
                <label for="city">Select your city:</label>

                    <select name="city" id="city" required>
                        <option value="">-- Choose a city --</option>
                        <option value="Amman">Amman</option>
                        <option value="Irbid">Irbid</option>
                        <option value="Zarqa">Zarqa</option>
                        <option value="Aqaba">Aqaba</option>
                    </select>

                    <br> <br><br>
                    <label for="message">Why you interest to join</label>
                    <textarea id="message" name="message" rows="5" cols="30" placeholder="Write here..." required></textarea>
                
                    <br><br>
                    <fieldset>
                        <legend>Select your courses:</legend>

                             <input type="checkbox" id="html" name="courses" value="html">
                             <label for="html">HTML</label>
                     
                             <input type="checkbox" id="css" name="courses" value="css">
                             <label for="css">CSS</label>
                       
                             <input type="checkbox" id="javascript" name="courses" value="javascript">
                             <label for="javascript">JavaScript</label>

                             <input type="checkbox" id="python" name="courses" value="python">
                             <label for="python">Python</label>
                    </fieldset>

                    <br><br>
                    <input type="checkbox" id="agreement" name="agreement" required>
                    <label for="agreement">I agree to the terms and conditions.</label>

                    <br><br>
                    <input type="submit" id="submit" value="Registration">
        </fieldset>
        </form>
    </body>

</html>
